name: probe

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub 允许的最短间隔，实际常晚几分钟
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 test_probe.py
      - run: python3 probe.py
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -qm "data: $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase && git push -q
